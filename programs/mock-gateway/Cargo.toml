[package]
name = "mock-gateway"
version = "0.1.0"
description = "Test-only Gateway dispatcher for svm-spoke adapter tests"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_gateway"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
test = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
svm-spoke = { path = "../svm-spoke", features = ["no-entrypoint"] }
