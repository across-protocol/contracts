[package]
name = "sponsored-cctp-src-periphery"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sponsored_cctp_src_periphery"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
test = []

[dependencies]
solana-secp256k1-recover = "3"
anchor-lang = { version = "1.1.2", features = ["init-if-needed", "event-cpi"]}
anchor-spl = "1.1.2"
libsecp256k1 = { version = "0.7.2", default-features = false }
solana-security-txt = "1.1.1"

# Anchor 1.x uses split Solana hashing crates. Host tests/IDL builds need software fallbacks.
[target.'cfg(target_os = "solana")'.dependencies]
solana-keccak-hasher = "3"

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-keccak-hasher = { version = "3", features = ["sha3"] }
