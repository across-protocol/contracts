# Synthetic "globals" section (chain id 0 is not a real chain; StdConfig requires top-level keys to
# resolve to a chain id, so global values live here). Read via CounterfactualConfig._deploySalt().
[0]
endpoint_url = "http://localhost"
[0.bytes32]
# Global CREATE2 salt for the counterfactual singleton infra (factory, bootstrap, beacon proxy,
# dispatcher, leaf impls). One value shared by every chain so the deterministic addresses stay in
# cross-chain parity; bump it to coordinate a fresh redeploy everywhere.
#
# TEST BEACONS. This is `keccak256("across-counterfactual-v5-test-beacons-2026-08-09")`, deliberately a full
# 32 bytes of entropy rather than a small counter: the previous salts were `0x…01`-`0x…06`, and anything in
# that range risks being reused by another deploy and silently landing on these addresses. Everything under
# this salt is a V5 TEST deployment, entirely separate from the production stack still living at salt
# `0x…06`. Changing it mints a whole new stack — a route migration, not a redeploy.
deploySalt = "0x91c0b5726eb78098e85d116ce3a407d5465d45efe2e214e7376c161e2e2b6c03"

# Per-token USD prices, 1e18-fixed, read by every chain (hence the globals section, not a per-chain repeat):
# the stable floor divides one price by the other and folds on-chain decimals, so a single set serves
# everywhere. A price is baked only where its token actually resolves on the chain. Zero = unpriced, which
# SKIPS the floor for every pair touching that token, leaving the authority-signed plan as the only
# protection — the intended setting for the volatile tokens, not an omission.
[0.uint]
usdcStablePrice = 1000000000000000000
usdceStablePrice = 1000000000000000000
usdtStablePrice = 1000000000000000000
pathUsdStablePrice = 1000000000000000000
usdgStablePrice = 1000000000000000000
wethStablePrice = 0 # volatile
wbtcStablePrice = 0 # volatile

# A chain's `[N.uint]` section carries its per-token max-execution-fee caps as the raw onchain
# amount baked into the beacon impl, in the token's own decimals — e.g. 2 USDC is 2000000 on 6-decimal
# chains but 2000000000000000000 on BSC (18 decimals). Each value applies to every bridge type for that
# token (CCTP, OFT, SpokePool). The `weth` cap is denominated in canonical WETH (18 decimals) on every
# chain and required only where `.WETH.<chainId>` exists; on ETH-gas chains it also caps the native
# msg.value route (the wrapped gas token IS WETH there). Non-ETH-gas chains do not get wrapped-native
# routes, so no cap is ever denominated in WBNB/WPOL/etc. Chains without required values CANNOT deploy
# a beacon impl — the deploy script reverts for any token the chain has configured whose fee cap is
# missing or zero (zero caps are only valid as markers on keys whose token is absent from the chain).
#
# `usdcCctpMaxFeeBps` is the one exception to the token-units rule: it caps the submitter-chosen
# Circle fast-transfer fee (vanilla CCTP) in bps of the burned amount. It is required on EVERY chain
# (baked into each beacon impl) and zero is a valid value — 0 ⇒ standard transfers only.
#
# Native USDC and bridged USDC.e are SEPARATE tokens with separate beacon getters: `usdc` resolves
# `.USDC.<chainId>` only, `usdce` resolves `.USDCe.<chainId>` where it is distinct from native USDC
# (mainnet's `.USDCe` entry aliases native USDC and resolves to zero). A supported USDC.e needs its own
# `usdceMaxExecutionFee` cap. USDC.e serves SpokePool routes only — bridged USDC has no CCTP burn path.
#
# A chain's `[N.bool]` section DECLARES its counterfactual support surface: seven tokens (usdc, usdce,
# usdt, wbtc, weth, pathUsd, usdg) and four bridges (spokePool, sponsoredCctp, vanillaCctp, oft). These are pure
# assertions, not switches: the beacon impl deploy cross-checks every flag against what constants.json
# and broadcast/deployed-addresses.json actually resolve, and reverts on any mismatch in either
# direction (declared-but-missing AND present-but-undeclared) or on a missing flag. Changing a chain's
# real capability (deploying a periphery, adding a token upstream) therefore requires a deliberate
# matching flag change here before beacon impls can deploy again.

