name: Setup Solana and Anchor
inputs:
  node_version:
    description: "Node version to install"
    required: true
runs:
  using: "composite"
  steps:
    - name: "Use Node ${{ inputs.node_version }}"
      uses: ./.github/actions/setup-node-if-needed
      with:
        node_version: ${{ inputs.node_version }}
    # Host Cargo is used for IDLs/unit tests; the verified image pins the SBF compiler.
    - name: Install host Rust
      uses: dtolnay/rust-toolchain@1.97.1
    # Keyed on everything the installer reads, so a pin or installer change refetches the tools.
    - name: Cache SVM tools
      uses: actions/cache@v4
      with:
        path: |
          ~/svm-tools
          ~/.cache/solana
        key: svm-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Anchor.toml', 'verified-build.json', 'scripts/svm/buildHelpers/installSvmTools.sh') }}
    - name: Install pinned Solana, Anchor and solana-verify release binaries
      shell: bash
      run: bash scripts/svm/buildHelpers/installSvmTools.sh
