name: Set up Foundry
description: Install the repository's mise tools without activating them globally; requires checkout and Node setup first
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.9.3
        add_shims_to_path: false
        export_path: false
        env: false
    - name: Verify Foundry version
      shell: bash
      run: mise exec -- node scripts/checkFoundryVersion.js
