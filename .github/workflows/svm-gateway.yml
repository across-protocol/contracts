name: SVM real Gateway conformance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # A maintainer must configure required reviewers on this environment and
    # approve only reviewed refs: the private dependency credential must never
    # be available to arbitrary pull-request code.
    environment: svm-gateway-integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require private dependency access
        env:
          GATEWAY_READ_TOKEN: ${{ secrets.SVM_GATEWAY_READ_TOKEN }}
        run: test -n "$GATEWAY_READ_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: across-protocol/solana-v5
          ref: 457cf693d09765c8e7e9ab33d23f84cba0999afe
          path: target/gateway-source
          token: ${{ secrets.SVM_GATEWAY_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: solana-developers/github-actions/setup-all@v0.2.5
        with:
          anchor_version: 0.31.1
          solana_version: 4.1.2
      - name: Install Gateway Anchor CLI
        run: |
          curl -sSfL --retry 3 https://github.com/otter-sec/anchor/releases/download/v1.1.2/anchor-1.1.2-x86_64-unknown-linux-gnu -o target/anchor-gateway
          chmod +x target/anchor-gateway
          target/anchor-gateway --version
      - run: yarn install --frozen-lockfile --ignore-optional
      - name: Build and test actual Gateway and prefunded adapter
        env:
          SVM_GATEWAY_CHECKOUT: ${{ github.workspace }}/target/gateway-source
          SVM_GATEWAY_ANCHOR: ${{ github.workspace }}/target/anchor-gateway
        run: yarn test-svm-gateway
